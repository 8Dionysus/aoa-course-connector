name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repo-local KAG index family
        # This helper pin is the accepted workflow action from #186. The
        # provider release identity is checked separately by the owner route.
        uses: 8Dionysus/aoa-kag/.github/actions/repo-local-kag-index@6a79e62c7d20b6b11406dee78f409ada4a51bb3f
        with:
          history-ref: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
          event-history-ref: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/checkout@v4
        with:
          repository: 8Dionysus/aoa-stats
          # aoa-stats v0.2.1 exact published tag target.
          ref: 339ecb2db22ac4552fa88756b650896ebbff5b56
          path: .deps/aoa-stats
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -r .deps/aoa-stats/requirements-dev.txt
      - run: python scripts/validate_local_stats_port.py
        env:
          AOA_STATS_ROOT: .deps/aoa-stats
      - run: python scripts/validate_connector.py
      - run: python -m pytest -q
      - run: python -m compileall -q src scripts
      - name: Run fixture-safe release scenarios
        run: python scripts/run_release_scenarios.py
